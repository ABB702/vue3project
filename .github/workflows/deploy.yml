# CD：PR 合并到 master 后自动构建并部署到 GitHub Pages
# 需要在仓库 Settings > Pages > Source 中选择 "GitHub Actions"
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore

      - name: Build
        run: npm run build
        env:
          # GitHub Pages 地址为 https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # 使用 history 路由时，刷新子页面会 404，用 404.html 兜底
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
